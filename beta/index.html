<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VSM Coach">
<meta name="theme-color" content="#dfe3e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171b" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>VSM Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 12h4M14 12h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10.5 10.5 12 13.5 13.5 10.5z" fill="#c8321e"/></svg><span class="hide-m">VSM Coach</span></div>
    <div id="crumbs"></div>
    <input id="map-title" placeholder="Titolo della mappa" aria-label="Titolo della mappa">
    <span id="map-kind">stato attuale</span>
    <div class="seg" role="group" aria-label="Attuale / futuro"><button id="tab-current" aria-pressed="true">Attuale</button><button id="tab-future" aria-pressed="false">Futuro</button></div>
    <div class="spacer"></div>
    <button class="btn icon" id="btn-undo" title="Annulla (Cmd/Ctrl+Z)" aria-label="Annulla">↶</button>
    <button class="btn icon" id="btn-redo" title="Ripeti (Cmd/Ctrl+Shift+Z)" aria-label="Ripeti">↷</button>
    <button class="btn" id="btn-maps" title="Le tue mappe">Mappe</button>
    <button class="btn icon" id="btn-menu" title="Menu" aria-label="Menu" aria-haspopup="menu">⋯</button>
  </header>

  <main>
    <div id="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="application" aria-label="Foglio della mappa del flusso di valore"></svg>
      <div id="hint" class="hidden" role="status" aria-live="polite"></div>
      <button id="coach-fab" title="Chiedi al coach (legge il foglio)" aria-label="Chiedi al coach">✦</button>
      <button id="ui-toggle" aria-pressed="false" title="Nascondi l'interfaccia (più foglio)" aria-label="Nascondi l'interfaccia">⇱</button>
      <div id="palette" role="toolbar" aria-label="Strumenti"></div>
      <button id="palette-toggle" aria-pressed="false" title="Nascondi gli strumenti" aria-label="Mostra o nascondi gli strumenti"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg></button>
      <div id="more-tools" class="hidden"></div>
      <div id="suggest" class="hidden" role="status" aria-live="polite"></div>
      <div id="levelsctl" class="hidden">
        <button class="btn" id="levels-btn" title="Livelli (mappe collegate)" aria-label="Livelli"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
        <div id="levels-list" class="hidden"></div>
      </div>
      <div id="zoomctl">
        <button class="btn" id="zoom-in" title="Ingrandisci" aria-label="Ingrandisci">+</button>
        <button class="btn" id="zoom-fit" title="Adatta il foglio" aria-label="Adatta il foglio">⤢</button>
        <button class="btn" id="zoom-out" title="Riduci" aria-label="Riduci">−</button>
      </div>
      <div id="quick" class="hidden" role="toolbar" aria-label="Azioni rapide sull'elemento selezionato"></div>
      <div id="pop" class="hidden"></div>
    </div>

    <aside id="drawer" class="closed">
      <div class="tabs">
        <button id="tab-coach" aria-selected="true">Coach ✦</button>
        <button id="tab-plan" aria-selected="false">Piano</button>
        <button class="close" id="drawer-close" title="Chiudi" aria-label="Chiudi il cassetto">✕</button>
      </div>
      <section class="pane" id="pane-coach">
        <div id="chat"></div>
        <div class="quick">
          <button class="btn small" data-q="Cosa faccio adesso? Guarda il foglio e dimmi il prossimo passo e lo strumento da usare.">Cosa faccio adesso?</button>
          <button class="btn small" data-q="Rivedi il foglio e dimmi le 1-3 correzioni più importanti (con patch applicabili se servono).">Rivedi il foglio</button>
          <button class="btn small" data-q="Che cosa, del modo in cui il lavoro accade ora, non è ideale? Proponi le nuvole temporalesche da aggiungere, con muda e regola.">Che cosa non è ideale?</button>
          <button class="btn small" data-q="Proponi lo stato futuro: meno vie di richiesta, meno passi, tempi standard derivati dai dati; crea la mappa futura con una patch e spiega ogni cambiamento con 'avvicina all'ideale?'.">Proponi lo stato futuro</button>
        </div>
        <div class="composer"><textarea id="chat-input" rows="1" placeholder="Scrivi al coach…" aria-label="Messaggio al coach" autocomplete="off"></textarea><button class="btn primary" id="chat-send">Invia</button></div>
        <div class="status"><span class="dot" id="status-dot"></span><span id="status-text"></span><span class="spacer"></span><button class="btn small ghost" id="btn-clear-chat">Svuota</button><button class="btn small ghost" id="btn-settings" aria-label="Impostazioni coach" title="Impostazioni coach">⚙︎</button></div>
      </section>
      <section class="pane hidden" id="pane-plan"><div class="pane-body" id="plan-body"></div></section>
    </aside>
  </main>
</div>

<div id="guidepop" class="hidden" role="dialog" aria-label="Guida — promemoria del metodo"></div>

<div id="menu" class="hidden">
  <button data-m="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9z"/><path d="M13 3v6h6"/><path d="M12 12v6M9 15h6"/></svg>Nuova mappa</button>
  <button data-m="detail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="3" width="13" height="13" rx="1.5"/><path d="M16 16v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h3" stroke-linecap="round"/></svg>Sotto-foglio di dettaglio</button>
  <button data-m="example"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c-2-1.4-4.5-2-8-2v16c3.5 0 6 .6 8 2 2-1.4 4.5-2 8-2V3c-3.5 0-6 .6-8 2z"/><path d="M12 5v16"/></svg>Esempio del libro</button>
  <button data-m="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.6 2.6 0 1 1 3.6 2.4c-.9.4-1.2 1-1.2 1.8"/><circle cx="12" cy="17" r=".4" fill="currentColor"/></svg>Guida pratica</button>
  <button class="compact-only" data-m="af"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13M14 4l4 4-4 4M20 16H7M10 12l-4 4 4 4"/></svg>Attuale ⇄ Futuro</button>
  <button class="compact-only" data-m="maps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Le tue mappe</button>
  <hr>
  <button class="sub-head" data-sub="file" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5a1 1 0 0 1 1-1h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M8 4v5h7V4M7 20v-7h10v7"/></svg>File e stampa<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  <div class="submenu hidden" id="sub-file">
    <button data-m="open">Apri JSON…</button>
    <button data-m="save">Salva JSON</button>
    <button data-m="svg">Esporta SVG</button>
    <button data-m="print">Stampa A3</button>
  </div>
  <button class="sub-head" data-sub="opt" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h8M16 7h4M4 17h4M12 17h8"/><circle cx="14" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Opzioni<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  <div class="submenu hidden" id="sub-opt">
    <button id="btn-link-mode">Frecce: dritte</button>
    <button id="btn-trace" aria-pressed="true">✓ Evidenzia il percorso</button>
    <button id="btn-tools-left" aria-pressed="false">○ Strumenti a sinistra</button>
    <button id="btn-overlays" aria-pressed="true">✓ Riepilogo sul foglio</button>
    <button id="btn-pen-mode" aria-pressed="true">✓ Penna Apple = matita</button>
    <button data-m="clear-ink">Cancella l'inchiostro</button>
  </div>
  <button class="sub-head" data-sub="coach" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 15.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/></svg>Coach<span class="tag-alfa">alfa</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  <div class="submenu hidden" id="sub-coach">
    <button data-m="coach">Apri il coach ✦</button>
    <button data-m="settings">Impostazioni API…</button>
  </div>
  <hr>
  <button data-m="delete" class="danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>Elimina questa mappa</button>
  <button data-m="exit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 8l-4 4 4 4M6 12h9"/></svg>Esci</button>
</div>
<input type="file" id="file-open" accept="application/json" hidden>

<dialog id="dlg-maps">
  <div class="d-head">Le tue mappe</div>
  <div class="d-body"><div id="maplist"></div></div>
  <div class="d-foot"><button class="btn" id="maps-close">Chiudi</button></div>
</dialog>

<dialog id="dlg-settings">
  <div class="d-head">Impostazioni coach (API)</div>
  <div class="d-body">
    <div class="presets" id="presets">
      <button class="btn small" data-preset="kimi">Kimi (Moonshot)</button>
      <button class="btn small" data-preset="glm">GLM (Z.ai)</button>
      <button class="btn small" data-preset="openrouter">OpenRouter</button>
      <button class="btn small" data-preset="custom">Personalizzato</button>
    </div>
    <div class="field"><label for="s-base">Endpoint base (OpenAI-compatibile)</label><input id="s-base" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://api.moonshot.ai/v1"></div>
    <div class="row"><div class="field"><label for="s-model">Modello</label><input id="s-model" autocomplete="off" spellcheck="false"></div><div class="field"><label>&nbsp;</label><button class="btn" id="s-list">Elenca modelli</button></div></div>
    <div class="field"><label for="s-key">Chiave API</label><input id="s-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…"></div>
    <div class="row"><div class="field"><label for="s-temp">Temperatura</label><input id="s-temp" type="number" inputmode="decimal" step="0.1" min="0" max="1.5"></div><div class="field"><label for="s-max">Max token risposta</label><input id="s-max" type="number" inputmode="numeric" step="100" min="200"></div></div>
    <label class="check"><input type="checkbox" id="s-proxy"> <span>Passa dal proxy locale (<code>serve.py</code>) — se il browser blocca la chiamata (CORS) o per tenere la chiave sul computer.</span></label>
    <label class="check"><input type="checkbox" id="s-stream" checked> <span>Risposta in streaming</span></label>
    <label class="check"><input type="checkbox" id="s-suggest" checked> <span>Suggerimenti di strumento (regole locali, badge discreto sulla palette)</span></label>
    <div id="s-models" class="hint" style="margin-top:8px"></div>
    <p class="notice warn" style="margin-top:10px">Le mappe descrivono processi: nessun dato identificativo di pazienti. La chiave resta in questo browser.</p>
  </div>
  <div class="d-foot"><button class="btn" id="s-cancel">Annulla</button><button class="btn primary" id="s-ok">Salva</button></div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="prompt.js"></script>
<script src="js/model.js"></script>
<script src="js/render.js"></script>
<script src="js/interact.js"></script>
<script src="js/panels.js"></script>
<script src="js/legend.js"></script>
<script src="js/coach.js"></script>
<script src="js/main.js"></script>
</body>
</html>
